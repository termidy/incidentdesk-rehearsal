name: SLA coverage

on:
  pull_request:
    paths:
      - incidentdesk/sla.py
      - tests/unit/test_sla.py

permissions:
  contents: read

jobs:
  sla-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/unit --cov=incidentdesk --cov-branch --cov-report=
      - name: Coverage gate for the SLA rules
        run: coverage report --include=incidentdesk/sla.py --fail-under=90
