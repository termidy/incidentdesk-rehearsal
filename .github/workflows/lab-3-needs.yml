name: Lab 3 needs
on:
  push:
    branches: [broken-workflows]
    paths: [.github/workflows/lab-3-needs.yml]

jobs:
  ask:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @github/copilot
      - run: copilot -s -p "In one sentence, what does config/production.yaml set?" > answer.md
      - uses: actions/upload-artifact@v7
        with: {name: answer, path: answer.md}
  show:
    needs: asks
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with: {name: answer}
      - run: cat answer.md
