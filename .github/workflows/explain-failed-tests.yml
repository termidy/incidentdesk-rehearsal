name: Explain failed tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  copilot-requests: write

jobs:
  explain:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Ask Copilot why the tests failed
        run: >
          copilot -s -p "CI run $RUN_ID failed. Read its failed log with
          gh run view $RUN_ID --log-failed and the code it points to.
          In at most 120 words say which test failed, why, and the smallest fix.
          Do not change any file."
          --allow-tool='shell(gh run view:*)' | tee explanation.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
      - name: Post it on the pull request
        run: gh pr comment "$PR" --body-file explanation.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
