name: Explain failed tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  explain:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    outputs:
      error: ${{ steps.ask.outputs.error }}
      attempts: ${{ steps.ask.outputs.attempts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Ask Copilot why the tests failed
        id: ask
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if copilot -s -p "CI run $RUN_ID failed. Read its failed log with
            gh run view $RUN_ID --log-failed and the code it points to.
            In at most 120 words say which test failed, why, and the smallest fix.
            Do not change any file." --allow-tool='shell(gh run view:*)' > explanation.md 2> error.txt; then
              cat explanation.md
              exit 0
            fi
            cat error.txt
            echo "error=$(head -n 1 error.txt)" >> "$GITHUB_OUTPUT"
            echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
            if [ "$attempt" = 1 ] && grep -qiE 'rate limit|timed out|ECONNRESET|50[234]' error.txt; then
              echo "A temporary error. One retry in 30 seconds."
              sleep 30
            else
              echo "Attempt $attempt failed. No retry."
              exit 1
            fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
      - uses: actions/upload-artifact@v7
        with:
          name: explanation
          path: explanation.md

  post:
    needs: explain
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: explanation
      - name: Post it on the pull request
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file explanation.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}

  report-failure:
    needs: explain
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Say on the pull request that Copilot could not explain it
        run: >
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body
          "Copilot could not explain CI run $RUN_ID. $ERROR
          Attempts: $ATTEMPTS. Only a temporary error is retried, and only once.
          A person should read the log: $LOG"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ERROR: ${{ needs.explain.outputs.error || 'It gave no answer within the time limit.' }}
          ATTEMPTS: ${{ needs.explain.outputs.attempts || 1 }}
          LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
