# The local database for running IncidentDesk and its tests. CI and the agent environment use the same image as a
# service container. The password is a test value of this local database, not a secret.
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: incidentdesk
      POSTGRES_PASSWORD: incidentdesk
      POSTGRES_DB: incidentdesk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentdesk"]
      interval: 2s
      retries: 15
