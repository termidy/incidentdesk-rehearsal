[project]
name = "incidentdesk"
version = "1.4.0"
description = "IncidentDesk: DemoSoft's incident management service (priorities, SLAs, postmortems)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.14",
    "sqlalchemy==2.0.55",
    "psycopg[binary]==3.2.13",
    "pydantic==2.14.2",
    "pytz==2024.2",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[project.scripts]
incidentdesk = "incidentdesk.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incidentdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (DATABASE_URL); skipped when it is not set",
]
